# Manifest for this project. See https://luaupm.com/docs
# Add dependencies with `embr add <scope/name>`, then run `embr install`.

[dependencies]
Signal = { name = "molyidev/signal", version = "^", index = "pesde" }
Pancakes = { name = "darkgamerroblox/pancakes", version = "^", index = "wally" } # For the sync library
Scribe = { name = "ericplane/scribe", version = "^", index = "wally" }

[indices]
wally = "https://github.com/UpliftGames/wally-index"
pesde = "https://github.com/pesde-pkg/index"

[tools]
rojo = "rojo-rbx/rojo@7.6.1"
rogen = "ldgerrits/rogen@1.4.4"
luau-lsp = "johnnymorganz/luau-lsp@1.69.0"
