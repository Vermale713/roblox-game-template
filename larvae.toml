#:schema https://raw.githubusercontent.com/larvae-luau/larvae/master/crates/larvae/larvae.schema.json
input = "src"
output = "dist"
target = "roblox-string"
exclude = [
  "packages/**",
  "src/Client/Network/*",
  "src/Server/Network/*",
  "src/Shared/Network/*",
]

[aliases]
pkg = "@game/ReplicatedStorage/Packages"
client = "@game/ReplicatedStorage/Client"
server = "@game/ServerScriptService"

[fmt]
column_width = 120
indent_type = "tabs"
indent_width = 4
quote_style = "auto-prefer-double"
call_parentheses = "none"
function_call = { style = "hug-last" }
sort_requires = { enabled = false }

[lint]
std = "roblox"

[lint.rules]
# Vide's create-syntax intentionally mixes dictionary props with array children in
# one table, so the mixed_table lint fires on every component. Allow it project-wide.
mixed_table = "allow"
