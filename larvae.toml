#:schema https://raw.githubusercontent.com/larvae-luau/larvae/master/crates/larvae/larvae.schema.json
# larvae configuration, run `larvae self code` for editor completion.
# No default.project.json found, the roblox-string target needs one
# or a [requires.mounts] table.

input = "src"
output = "dist"
target = "roblox-string"
exclude = ["dist", "packages"]


[requires]
strict = true
sourcemap = "sourcemap.json"

[requires.mounts]
"packages/roblox" = "@game/ReplicatedStorage/Packages"
"packages/server" = "@game/ServerStorage/ServerPackages"
"src/Platform" = "@game/ReplicatedStorage/Shared/Platform"

[aliases]
pkg = "@game/ReplicatedStorage/Packages"
spkg = "@game/ServerStorage/ServerPackages"
base = "@game/ReplicatedStorage/Shared/Base"
platform = "@game/ReplicatedStorage/Shared/Platform"

[lsp]
enabled = true
fflags.enable_new_solver = true
completion.imports.require_style = "nearest_absolute"

[process]
generator = "readable"

[fmt]
# Blink codegen output; regenerate with `just network` instead of formatting it.
exclude = ["src/Core/Network/**", "src/StarterPlayer"]
recommended = true
column_width = 120
indent_type = "spaces"
indent_width = 4
quote_style = "auto-prefer-double"
call_parentheses = "none"
collapse_simple_statement = "always"
prefer_const.enabled = true
leading_zero = "add"
require_binding = "const"
sort_requires.enabled = true
sort_requires.grouping = "by-kind"
unused_imports = "remove"
block_newline_gaps = "never"
if_expression.style = "leading"
function_style = "const"

[lint]
# Blink codegen output; not ours to fix.
exclude = ["src/Core/Network/**", "src/StarterPlayer"]
recommended = true
std = "roblox"

[lint.rules]
unused_variable = "warn"
unused_function = "warn"
unused_import = "warn"
almost_swapped = "deny"
and_or_conditional = "deny"
mixed_table = "allow"
# Set a level for one lint under [lint.rules], or for a whole kind
# under [lint.groups]. `larvae lint --explain <name>` describes one.
